# Cloudflare Pages configuration for the npsnextjs deployment.
# Used by `wrangler pages dev` (local preview) and Cloudflare's build system.
#
# nodejs_compat: required by @cloudflare/next-on-pages for Next.js runtime APIs
#   (Buffer, process, etc.) used by SSR rendering of the App Router.

name = "npsnextjs"
compatibility_date = "2026-05-19"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"
